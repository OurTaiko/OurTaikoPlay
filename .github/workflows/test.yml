name: Test
run-name: "OurTaikoPlay tests (${{ github.event_name == 'pull_request' && 'finished, editmode' || format('{0}, {1}', inputs.suite, inputs.mode) }}) ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

# Builds do not wait for tests. Pull requests from branches of this repository get the EditMode
# finished suite as a signal only (not a merge requirement); fork PRs get no secrets, so the job is
# skipped for them. Everything else is run manually. The pull_request paths-ignore mirrors the
# documentation and AOCI entries of build.yml; changes to this workflow or .github/unity-test do run it.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test assemblies (in-progress has PlayMode tests only)
        type: choice
        default: finished
        options: [finished, in-progress, all]
      mode:
        description: Test mode
        type: choice
        default: both
        options: [both, editmode, playmode]
  pull_request:
    paths-ignore:
      - "**.md"
      - "aoci*.txt"
      - ".aoci/**"

permissions:
  contents: read
  checks: write # unity-test-runner posts the test results as a check run

# A new push to a PR cancels its previous run; every manual run gets a group of its own.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-pr-{0}', github.event.pull_request.number) || format('test-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: Test (${{ matrix.mode }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every EditMode test is in the finished suite, so in-progress runs PlayMode only.
        mode: ${{ fromJSON(github.event_name == 'pull_request' && '["editmode"]' || (inputs.suite == 'in-progress' && '["playmode"]' || (inputs.mode == 'both' && '["editmode","playmode"]' || format('["{0}"]', inputs.mode)))) }}
    env:
      SUITE: ${{ github.event_name == 'pull_request' && 'finished' || inputs.suite }}
      FINISHED: ${{ matrix.mode == 'editmode' && 'OurTaiko.FinishedTests' || 'OurTaiko.FinishedPlayModeTests' }}
      IN_PROGRESS: OurTaiko.PlayModeTests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - uses: ./.github/actions/lfs-pull
      # The nameplate set is not in the repository: the tests draw the published one, as players get it.
      - name: Fetch the published nameplate set
        run: python3 -I Tools/nameplate-samples/lumen/fetch.py Tools/nameplate-samples/lumen/set

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-test-

      - id: assemblies
        run: |
          # "all" passes no filter: every project test assembly of this mode.
          case "$SUITE" in
            finished) echo "filter=-assemblyNames $FINISHED" >> "$GITHUB_OUTPUT" ;;
            in-progress) echo "filter=-assemblyNames $IN_PROGRESS" >> "$GITHUB_OUTPUT" ;;
            *) echo "filter=" >> "$GITHUB_OUTPUT" ;;
          esac

      # AudioDevice tests measure real playback, which the container cannot provide; run them locally.
      - name: Prepare Unity with Linux media libraries and clocked audio
        run: |
          version=$(awk '/^m_EditorVersion:/ {print $2}' ProjectSettings/ProjectVersion.txt)
          docker build --build-arg "editor=unityci/editor:ubuntu-${version}-linux-il2cpp-4.0.0" -t ourtaiko-unity-test:local .github/unity-test

      - uses: game-ci/unity-test-runner@v4
        with:
          cliVersion: v0.1.76
          customImage: ourtaiko-unity-test:local
          testMode: ${{ matrix.mode }}
          customParameters: ${{ steps.assemblies.outputs.filter }} -testCategory !AudioDevice
          artifactsPath: test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.mode }}
          path: test-results
          retention-days: 7
