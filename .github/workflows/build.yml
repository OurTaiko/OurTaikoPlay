name: Build
run-name: OurTaikoPlay ${{ github.ref_name }}

# main publishes the rolling "nightly" pre-release; a v* tag publishes a formal release.
# Tests do not gate builds; run the Test workflow manually when needed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ios_only:
        description: Only build iOS
        type: boolean
        default: false
      upload_testflight:
        description: Upload the manual iOS build to TestFlight
        type: boolean
        default: false
      resume_build:
        description: Resume distribution of an already uploaded iOS build (no rebuild or upload)
        type: string
        default: ''
      resume_version:
        description: Version of the already uploaded build (defaults to project version)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  BUILD_NAME: OurTaikoPlay
  BUILDS_PATH: build

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      display: ${{ steps.v.outputs.display }}
      android_code: ${{ steps.v.outputs.android_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # version: Player Settings / tag version; display: file names and the shipped version string.
      - id: v
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::Release tags must look like v1.2 or v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
          else
            VERSION=$(grep -m1 'bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          fi
          # Count the full history of the checked-out commit, never the CI run number.
          BUILD_NUMBER=$(git rev-list --count HEAD)
          DISPLAY="${VERSION}-${BUILD_NUMBER}"
          {
            echo "version=$VERSION"
            echo "display=$DISPLAY"
            echo "android_code=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, display $DISPLAY"

  build:
    name: Build (${{ matrix.name }})
    if: (github.event_name != 'workflow_dispatch' || !inputs.ios_only) && inputs.resume_build == ''
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: StandaloneOSX
            method: OurTaiko.Editor.PlayerBuilds.BuildMacOS
          - name: Windows
            platform: StandaloneWindows64
            method: OurTaiko.Editor.PlayerBuilds.BuildWindows
          - name: Android
            platform: Android
            method: OurTaiko.Editor.PlayerBuilds.BuildAndroid
    env:
      DISPLAY_VERSION: ${{ needs.version.outputs.display }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
          fetch-depth: 0
      - uses: ./.github/actions/lfs-pull

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.platform }}-

      # Without ANDROID_KEYSTORE_BASE64 the APK uses Unity's debug signature.
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.platform }}
          buildMethod: ${{ matrix.method }}
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILDS_PATH }}
          versioning: Custom
          version: ${{ needs.version.outputs.display }}
          androidVersionCode: ${{ needs.version.outputs.android_code }}
          androidExportType: androidPackage
          androidKeystoreName: ourtaiko.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Package
        run: |
          set -euo pipefail
          sudo chown -R "$USER" "$BUILDS_PATH"
          mkdir -p out
          DIR="$BUILDS_PATH/${{ matrix.platform }}"
          if [[ "${{ matrix.platform }}" == Android ]]; then
            cp "$DIR/$BUILD_NAME.apk" "out/$BUILD_NAME-$DISPLAY_VERSION-Android-arm64.apk"
          elif [[ "${{ matrix.platform }}" == StandaloneOSX ]]; then
            # Keep the app bundle's executable permissions and symbolic links in the archive.
            (cd "$DIR" && zip -qry "$GITHUB_WORKSPACE/out/$BUILD_NAME-$DISPLAY_VERSION-macOS-universal.zip" "$BUILD_NAME.app")
          else
            # Ship the whole folder: the exe needs its _Data directory and the BASS DLLs.
            (cd "$DIR" && zip -qry "$GITHUB_WORKSPACE/out/$BUILD_NAME-$DISPLAY_VERSION-Windows-x64.zip" . \
              -x '*_BurstDebugInformation_DoNotShip/*' '*_BackUpThisFolder_ButDontShipItWithYourGame/*')
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # iOS: Unity exports the Xcode project on a macOS runner; with the Apple secrets set, fastlane
  # signs it manually (Apple Distribution + an App Store profile), builds the IPA and uploads it to
  # TestFlight. Signing credentials are required. The nightly release does not
  # wait for it and never carries the IPA: TestFlight is its distribution.
  ios:
    name: Build (iOS) and TestFlight
    runs-on: macos-26
    timeout-minutes: 120
    needs: [version]
    if: inputs.resume_build == ''
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_PROFILE_NAME: ${{ secrets.APPSTORE_PROFILE_NAME }}
      # A TestFlight external group to distribute each build to; empty = internal testers only.
      TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_GROUP }}
      BUNDLE_ID: org.ourtaiko.play
      EXPORT_DIR: ${{ github.workspace }}/build/iOS/OurTaikoPlay
      IPA_DIR: ${{ github.workspace }}/build/ipa
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
          fetch-depth: 0
      - uses: ./.github/actions/lfs-pull

      - name: Check signing configuration
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for key in APPLE_TEAM_ID APPSTORE_PROFILE_NAME CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing iOS signing configuration: $key"
              exit 1
            fi
          done

      - name: Import the Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-iOS-

      # CFBundleShortVersionString must be plain dotted numbers, so iOS takes the bare version;
      # the build number (CFBundleVersion) is the commit count, set by PlayerBuilds.
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: iOS
          buildMethod: OurTaiko.Editor.PlayerBuilds.BuildIOS
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILDS_PATH }}
          versioning: Custom
          version: ${{ needs.version.outputs.version }}

      # IosProjectBranding names the project, app target and scheme OurTaikoPlay; UnityFramework keeps its name.
      - name: Locate the Xcode project
        id: xcode
        run: |
          set -euo pipefail
          PROJECT=$(ls -d "$EXPORT_DIR"/*.xcodeproj | head -n 1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Project $PROJECT, scheme $SCHEME"

      - name: Install the App Store provisioning profile
        if: env.APPSTORE_PROFILE_NAME != ''
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$DIR/appstore.mobileprovision"
          security cms -D -i "$DIR/appstore.mobileprovision" | plutil -extract Name raw -

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: bundle install

      - name: Sign and build the IPA
        if: env.APPSTORE_PROFILE_NAME != ''
        env:
          IOS_PROJECT_PATH: ${{ steps.xcode.outputs.project }}
          IOS_SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          mkdir -p "$IPA_DIR"
          bundle exec fastlane ios build

      - name: Show the IPA's identity and version
        id: ipa
        if: env.APPSTORE_PROFILE_NAME != ''
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          unzip -q "$IPA_DIR/OurTaikoPlay.ipa" -d "$TMP"
          PLIST=$(ls -d "$TMP"/Payload/*.app | head -n 1)/Info.plist
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion; do
            printf '%s: ' "$key"; /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST"
          done
          ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          [[ "$ID" == "$BUNDLE_ID" && "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ && "$NUMBER" =~ ^[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        if: github.event_name == 'push' || inputs.upload_testflight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APP_VERSION: ${{ steps.ipa.outputs.version }}
          BUILD_NUMBER: ${{ steps.ipa.outputs.number }}
        run: |
          set -euo pipefail
          if [[ -z "$APPSTORE_KEY_ID" || -z "$APPSTORE_PRIVATE_KEY" ]]; then
            echo "::error::Missing TestFlight API key"
            exit 1
          fi
          bundle exec fastlane ios deliver_beta

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-iOS
          path: ${{ env.IPA_DIR }}/OurTaikoPlay.ipa
          if-no-files-found: ignore
          retention-days: 7

  resume-testflight:
    name: Resume TestFlight distribution
    if: github.event_name == 'workflow_dispatch' && inputs.resume_build != ''
    needs: [version]
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
      BUNDLE_ID: org.ourtaiko.play
      APP_VERSION: ${{ inputs.resume_version || needs.version.outputs.version }}
      BUILD_NUMBER: ${{ inputs.resume_build }}
      TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_GROUP }}
      RESUME_DISTRIBUTION: 'true'
      BUILD_SOURCE: Previously uploaded CI build
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Validate the exact build
        run: |
          set -euo pipefail
          [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ && "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install fastlane
        run: bundle install
      - name: Wait for the exact build and distribute it
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: bundle exec fastlane ios deliver_beta

  publish:
    name: Publish ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'nightly' }}
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
      DISPLAY_VERSION: ${{ needs.version.outputs.display }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: collected
          merge-multiple: true

      - name: Publish nightly
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push origin -f nightly
          gh release delete nightly -y 2>/dev/null || true
          printf 'Automated nightly build.\nVersion: %s\nCommit: %s\nBuilt at: %s (UTC+8)\n' \
            "$DISPLAY_VERSION" "$GITHUB_SHA" "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" > notes.md
          gh release create nightly collected/* --title "Nightly" --notes-file notes.md --prerelease

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" collected/* --verify-tag \
            --title "OurTaikoPlay $DISPLAY_VERSION" --generate-notes
