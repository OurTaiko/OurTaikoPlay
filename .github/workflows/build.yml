name: Build
run-name: OurTaikoPlay ${{ github.ref_name }}

# main publishes the rolling "nightly" pre-release; a v* tag publishes a formal release.
# Tests do not gate builds; run the Test workflow manually when needed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  BUILD_NAME: OurTaikoPlay
  BUILDS_PATH: build

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      display: ${{ steps.v.outputs.display }}
      android_code: ${{ steps.v.outputs.android_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # version: Player Settings / tag version; display: file names and the shipped version string.
      - id: v
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "::error::Release tags must look like v1.2 or v1.2.3, got $GITHUB_REF_NAME"
              exit 1
            fi
            DISPLAY="$VERSION"
          else
            VERSION=$(grep -m1 'bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')
            DISPLAY="${VERSION}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          {
            echo "version=$VERSION"
            echo "display=$DISPLAY"
            echo "android_code=$(git rev-list HEAD --count)"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, display $DISPLAY"

  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: StandaloneWindows64
            method: OurTaiko.Editor.PlayerBuilds.BuildWindows
          - name: Android
            platform: Android
            method: OurTaiko.Editor.PlayerBuilds.BuildAndroid
    env:
      DISPLAY_VERSION: ${{ needs.version.outputs.display }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      - uses: ./.github/actions/lfs-pull

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.platform }}-

      # Without ANDROID_KEYSTORE_BASE64 the APK uses Unity's debug signature.
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.platform }}
          buildMethod: ${{ matrix.method }}
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILDS_PATH }}
          versioning: Custom
          version: ${{ needs.version.outputs.display }}
          androidVersionCode: ${{ needs.version.outputs.android_code }}
          androidExportType: androidPackage
          androidKeystoreName: ourtaiko.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Package
        run: |
          set -euo pipefail
          sudo chown -R "$USER" "$BUILDS_PATH"
          mkdir -p out
          DIR="$BUILDS_PATH/${{ matrix.platform }}"
          if [[ "${{ matrix.platform }}" == Android ]]; then
            cp "$DIR/$BUILD_NAME.apk" "out/$BUILD_NAME-$DISPLAY_VERSION-Android-arm64.apk"
          else
            # Ship the whole folder: the exe needs its _Data directory and the BASS DLLs.
            (cd "$DIR" && zip -qry "$GITHUB_WORKSPACE/out/$BUILD_NAME-$DISPLAY_VERSION-Windows-x64.zip" . \
              -x '*_BurstDebugInformation_DoNotShip/*' '*_BackUpThisFolder_ButDontShipItWithYourGame/*')
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'nightly' }}
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
      DISPLAY_VERSION: ${{ needs.version.outputs.display }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: collected
          merge-multiple: true

      - name: Publish nightly
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push origin -f nightly
          gh release delete nightly -y 2>/dev/null || true
          printf 'Automated nightly build.\nVersion: %s\nCommit: %s\nBuilt at: %s (UTC+8)\n' \
            "$DISPLAY_VERSION" "$GITHUB_SHA" "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" > notes.md
          gh release create nightly collected/* --title "Nightly" --notes-file notes.md --prerelease

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" collected/* --verify-tag \
            --title "OurTaikoPlay $DISPLAY_VERSION" --generate-notes
