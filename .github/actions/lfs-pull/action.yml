name: Pull LFS with cache
description: Restore .git/lfs from cache before git lfs pull, so repeated builds do not spend the LFS bandwidth quota.

runs:
  using: composite
  steps:
    - name: Hash LFS object list
      id: lfs
      shell: bash
      run: echo "hash=$(git lfs ls-files -l | cut -d' ' -f1 | sort | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Cache LFS objects
      uses: actions/cache@v4
      with:
        path: .git/lfs
        key: lfs-${{ runner.os }}-${{ steps.lfs.outputs.hash }}
        restore-keys: |
          lfs-${{ runner.os }}-

    - name: Pull LFS objects
      shell: bash
      run: git lfs pull
